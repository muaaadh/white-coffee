<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>White Rewards · White Coffee House</title>
  <meta name="description" content="White Rewards, the loyalty card for White Coffee House in Hulhumalé. Earn beans on every visit, collect coffee stamps, redeem rewards and manage your karaoke room bookings.">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="icon" href="../assets/img/logo-mark.svg" type="image/svg+xml">
  <link rel="preload" href="../assets/img/menu/leather-1200.webp" as="image" type="image/webp">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="portal.css">
</head>
<body data-view="loading" data-auth="0">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar" id="topbar">
    <div class="topbar__inner">
      <a class="plogo" href="#card" aria-label="White Rewards home">
        <img class="plogo__mark" src="../assets/img/logo-mark.svg" alt="" width="40" height="40">
        <span class="plogo__text">
          <span class="plogo__word">White Coffee House</span>
          <span class="plogo__name">White Rewards</span>
        </span>
      </a>

      <nav class="toptabs" aria-label="Portal sections">
        <a class="toptab" href="#card" data-tab="card">Card</a>
        <a class="toptab" href="#rewards" data-tab="rewards">Rewards<span class="tab-dot" hidden></span></a>
        <a class="toptab" href="#karaoke" data-tab="karaoke">Karaoke</a>
        <a class="toptab" href="#activity" data-tab="activity">Activity</a>
        <a class="toptab" href="#profile" data-tab="profile">Profile</a>
      </nav>

      <div class="topbar__end">
        <a class="topbar__site" href="../">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
          <span>Website</span>
        </a>
        <a class="whoami" id="top-avatar" href="#profile" hidden></a>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <div class="shell">
      <aside class="side" id="side" aria-label="Your membership card"></aside>
      <div class="view" id="view"></div>
    </div>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Portal sections">
    <a class="tab" href="#card" data-tab="card">
      <span class="tab__ic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="5.5" width="18" height="13" rx="1.5"/><path d="M3 10h18M7 14.5h4"/></svg></span>
      <span class="tab__label">Card</span>
    </a>
    <a class="tab" href="#rewards" data-tab="rewards">
      <span class="tab__ic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3.5" y="8.5" width="17" height="4" rx="1"/><path d="M5 12.5v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7M12 8.5v12M12 8.5C10.5 5 6.5 4.5 6.5 7c0 1.5 2.5 1.5 5.5 1.5Zm0 0C13.5 5 17.5 4.5 17.5 7c0 1.5-2.5 1.5-5.5 1.5Z"/></svg><span class="tab-dot" hidden></span></span>
      <span class="tab__label">Rewards</span>
    </a>
    <a class="tab" href="#karaoke" data-tab="karaoke">
      <span class="tab__ic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.75 11a6.25 6.25 0 0 0 12.5 0M12 17.25V21M8.75 21h6.5"/></svg></span>
      <span class="tab__label">Karaoke</span>
    </a>
    <a class="tab" href="#activity" data-tab="activity">
      <span class="tab__ic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.75 12a8.25 8.25 0 1 0 2.4-5.83"/><path d="M4 3.75v3.5h3.5"/><path d="M12 7.75V12l2.75 1.75"/></svg></span>
      <span class="tab__label">Activity</span>
    </a>
    <a class="tab" href="#profile" data-tab="profile">
      <span class="tab__ic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="8.5" r="3.75"/><path d="M4.75 20c.9-3.6 3.8-5.5 7.25-5.5s6.35 1.9 7.25 5.5"/></svg></span>
      <span class="tab__label">Profile</span>
    </a>
  </nav>

  <div class="toasts" id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
  <div id="layer"></div>

  <noscript><p class="noscript">White Rewards needs JavaScript to run this demo.</p></noscript>

  <script src="../assets/js/store.js"></script>
  <script src="../assets/vendor/qrcode.min.js"></script>
  <script src="portal.js"></script>
</body>
</html>
